<body>
  <h1>犬</h1>
  <p>四足歩行の哺乳類</p>
  <hr>
  <h3>トイプードル</h3>
  <p><mark>結構人気</mark>な犬種。</p>

  <h3>マルチーズ</h3>

  <h2>私の一番好きな犬種は</h2>
  <p>トイプードルとマルチーズのハーフである、<strong>マルプー</strong>です。</p>
